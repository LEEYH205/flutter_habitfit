version: '3.8'

services:
  aihub-server:
    build: .
    container_name: aihub-food-classifier
    ports:
      - "5001:5000"
    volumes:
      # AI-Hub 모델 파일 마운트 (호스트에서 컨테이너로)
      - ../aihub_food:/app/aihub_food:ro
      # 로그 디렉토리
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DOCKER_ENV=true
      - CUDA_VISIBLE_DEVICES=""  # CPU 모드 (GPU 사용시 제거)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aihub-network

  # Redis (선택사항 - 캐싱용)
  redis:
    image: redis:7-alpine
    container_name: aihub-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - aihub-network

  # Nginx (선택사항 - 리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: aihub-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - aihub-server
    restart: unless-stopped
    networks:
      - aihub-network

networks:
  aihub-network:
    driver: bridge

volumes:
  logs:

version: '3.8'

services:
  aihub-server:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: aihub_server_simple
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - DOCKER_ENV=true
      - CUDA_VISIBLE_DEVICES="" # CPU 모드
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: nginx_proxy_simple
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - aihub-server
    restart: unless-stopped

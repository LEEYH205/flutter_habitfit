name: habitfit_mvp
description: habitfit - Habit tracking and fitness app with HealthKit integration (Flutter + Firebase + Camera)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  flutter_riverpod: any
  firebase_core: any
  cloud_firestore: any
  firebase_messaging: any
  firebase_auth: any
  firebase_remote_config: any
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  camera: any
  image_picker: any
  path_provider: any
  permission_handler: any
  tflite_flutter: ^0.11.0
  ffi: any
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2
  shared_preferences: ^2.2.2
  health: ^8.1.0
  fl_chart: ^0.66.2
  table_calendar: ^3.0.9
  latlong2: ^0.9.0
  flutter_map: ^8.0.0
  go_router: ^14.2.7
  geocoding: ^2.1.1
  image: ^4.1.7
  http: ^1.1.0
  device_info_plus: ^9.1.0
  package_info_plus: ^4.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/models/
